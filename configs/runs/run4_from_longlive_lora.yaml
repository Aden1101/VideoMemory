# Run 4: run 3, started from LongLive's released LoRA instead of Anchor-Forcing's.
#
# Derived from configs/runs/run3_write_evicted_stable.yaml. Changed: lora_ckpt, plus logdir and
# the run name. generator_ckpt stays as it is: ckpt/base.pt is already LongLive's own base.
# Their lora.pt carries step: 3000, so resume_step must stay false here.
trainer: score_distillation
max_iters: 2000
log_iters: 250
mixed_precision: true
seed: 0
distribution_loss: dmd_switch
load_raw_video: false
gradient_accumulation_steps: 1
max_checkpoints: 3
auto_resume: false
logdir: ckpt/runs/run4_from_longlive_lora
use_wandb: true
wandb_project: anchor-forcing-memory
# 0.99 per generator update, one every 5 trainer steps: tau ~500 steps. 0.999 would barely move.
ema_weight: 0.99
ema_start_step: 250
generator_ckpt: ckpt/base.pt
# from the LongLive release: HF Efficient-Large-Model/LongLive-1.3B, models/lora.pt
lora_ckpt: ckpt/longlive/lora.pt
resume_step: false
data_path: ckpt/prompts/train/vidprom_filtered_extended_switch.txt
switch_prompt_path: ckpt/prompts/train/vidprom_filtered_extended_switch.txt
batch_size: 1
total_batch_size: 64
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: full
text_encoder_cpu_offload: true
real_score_cpu_offload: true
log_memory_stats: true
assert_memory_drift: true
lr: 1.0e-05
beta1: 0.0
beta2: 0.999
lr_critic: 2.0e-06
beta1_critic: 0.0
beta2_critic: 0.999
lr_mem: 5.0e-05
max_grad_norm_mem: 1.0
lora_unfreeze_from_block: 0
train_write: true
text_dropout_prob: 0.3
weight_decay: 0.05
lr_decay_start: 400
lr_floor_frac: 0.1
lr_mem_floor_frac: 0.05
cache_dropout_prob: 0.3
cache_dropout_prob_end: 0.1
cache_dropout_anneal_steps: 800
cache_dropout_sink: 0
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 240
- 16
- 60
- 104
negative_prompt: "色调艳丽，过曝，静态，\
  细节模糊不清，字幕，风格，作\
  品，画作，画面，静止，整体发\
  灰，最差质量，低质量，JPEG压缩\
  残留，丑陋的，残缺的，多余的\
  手指，画得不好的手部，画得不\
  好的脸部，畸形的，毁容的，形\
  态畸形的肢体，手指融合，静止\
  不动的画面，杂乱的背景，三条\
  腿，背景人很多，倒着走"
gradient_checkpointing: true
num_frame_per_block: 3
same_step_across_blocks: true
num_train_timestep: 1000
timestep_shift: 5.0
real_name: wan_models/Wan2.1-T2V-1.3B
fake_name: wan_models/Wan2.1-T2V-1.3B
generator_name: wan_models/Wan2.1-T2V-1.3B
ts_schedule: false
denoising_loss_type: flow
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3
  memory_layers:
  - 5
  - 16
  - 27
  gate_init: 0.1
  bounded_gate: true
  single_norm: false
  use_decay: true
  muon_update_steps: 5
  ckpt_write: true
  gate_extra: []
  bounded_mod: true
  rel_norm: true
  dc_remove: true
  mem_stream_scale: 0.5
  ema_alpha: 0.0
  eviction_feed: true
guidance_scale: 3.0
global_sink: true
slice_last_frames: 27
rope_enhance: true
streaming_training: true
sink_update_ratio: 0.0
use_prompt_cache: true
use_decouple_dmd: false
use_gan: false
vis_interval: 50
vis_ema: false
vis_video_lengths:
- 60
val_batch_size: 1
val_data_path: ckpt/prompts/train/vidprom_filtered_extended.txt
val_switch_prompt_path: ckpt/prompts/train/vidprom_filtered_extended_switch.txt
switch_mode: random_choice
switch_choices:
- 1000
streaming_chunk_size: 21
streaming_max_length: 300
streaming_min_new_frame: 18
train_first_chunk: true
last_step_only: false
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  apply_to_critic: true
  verbose: false
bptt_window: 14
bptt_window_min: 4
grad_tail_W: 1
train_seed_every: 4
