# Re-ID revisit probe: model substrate copied from c3_stable/eval1000_sink1/memon.yaml
# (same trained checkpoint, same memory graft). Prompt-pair / switch settings live in
# run_reid_probe.py CLI, not here.
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
num_frame_per_block: 3
model_name: wan_models/Wan2.1-T2V-1.3B
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 1
  memory_layers:
  - 5
  - 16
  - 27
  gate_init: 0.1
  bounded_gate: true
  single_norm: false
  use_decay: true
  muon_update_steps: 5
  ckpt_write: true
  gate_extra: []
  bounded_mod: true
  rel_norm: true
  dc_remove: true
  mem_stream_scale: 0.5
  ema_alpha: 0.0
  eviction_feed: true
use_ema: false
seed: 42
global_sink: true
context_noise: 0
rope_enhance: true
use_prompt_cache: true
generator_ckpt: ckpt/base.pt
lora_ckpt: /shared/ssd_14T_project/adenelmi/c3_stable/keep/checkpoint_model_001000/model.pt
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  verbose: false
