# E1 (Fable "E2" objective MVP): give the memory a real job under DMD.
# Changes vs ttt_memory.yaml, all per the 2026-07-02 Fable verdict (source of truth reference/fable_brainstorm_verdict.md):
#   - read-path hygiene: bounded tanh gate init 0 + single_norm (drop the redundant o_norm)
#   - frame-level identity anchor loss (DINO cosine to chunk-0, backprops through decode+gate+read+write)
#   - differentiable temporal-variance floor (anti-freeze), ships WITH the identity term
#   - text-dropout (force the memory to carry the subject, not re-read the prompt)
#   - LoRA unfreeze (backbone co-adapts to use the memory)
# NOT launched yet: gated on E0 (baseline drift headroom + anchoring probe) and on a clean GPU.
trainer: score_distillation
max_iters: 3000
log_iters: 150
mixed_precision: true
seed: 0
distribution_loss: dmd_switch
load_raw_video: false
gradient_accumulation_steps: 1
max_checkpoints: 4
auto_resume: False
logdir: /shared/ssd_14T_project/adenelmi/e1_identity_v1

use_wandb: true
wandb_project: anchor-forcing-memory
wandb_name: e1_identity_v1

ema_weight: 0.99
ema_start_step: 200

generator_ckpt: ckpt/base.pt
lora_ckpt: ckpt/final.pt        # resume the trained Anchor-Forcing LoRA
resume_step: False

data_path: ckpt/prompts/train/vidprom_filtered_extended_switch.txt
switch_prompt_path: ckpt/prompts/train/vidprom_filtered_extended_switch.txt   # base==switch => NO semantic switch = plain-long regime (intended for E1)
batch_size: 1
total_batch_size: 64

# fsdp
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: full
text_encoder_cpu_offload: true
real_score_cpu_offload: true
log_memory_stats: true
assert_memory_drift: false      # E1 adds a decode+DINO path; mem is expected to move, don't assert-flat

# optimizers
lr: 1.0e-5                      # LoRA (unfrozen backbone), matches the earlier full-unfreeze run
beta1: 0.0
beta2: 0.999
lr_critic: 2.0e-6
beta1_critic: 0.0
beta2_critic: 0.999
lr_mem: 1.0e-4                  # memory fast-weight / read / write params

lora_unfreeze_from_block: 0     # unfreeze ALL LoRA blocks (backbone co-adapts to the memory)
train_write: true               # train the write path (identity grad should reach the write)

# --- E1 objective terms (read via getattr in model/streaming_training.py) ---
text_dropout_prob: 0.4          # MemGen-shaped (only fires for chunk_start_frame>0); force memory to carry id
id_loss_weight: 1.0             # frame-level DINO identity anchor
id_decode_frames: 2             # latent frames decoded WITH grad per chunk (VRAM knob; drop to 1 if OOM)
tv_loss_weight: 0.5             # anti-freeze temporal-variance floor (ships with the id term, Fable-mandatory)
tv_motion_floor: 0.0            # TODO CALIBRATE: set to ~0.5x baseline e1_latent_motion (read it from the first ~20 steps' log, then resume). 0.0 = hinge inactive (logs motion only).

dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 240
- 16
- 60
- 104
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'

gradient_checkpointing: true
num_frame_per_block: 3
same_step_across_blocks: true
num_train_timestep: 1000
timestep_shift: 5.0
real_name: wan_models/Wan2.1-T2V-1.3B
fake_name: wan_models/Wan2.1-T2V-1.3B
generator_name: wan_models/Wan2.1-T2V-1.3B
ts_schedule: false
denoising_loss_type: flow
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3
  memory_layers: [5, 16, 27]   # MAG at 3 blocks (matches gate01-750)
  gate_init: 0.0               # bounded tanh init 0 = do-no-harm start; opens via the identity gradient
  bounded_gate: true           # read hygiene: tanh-bound the gate
  single_norm: true            # read hygiene: drop redundant o_norm (raw read magnitude reaches proj)
  use_decay: false             # Scal3R/LaCT norm-conserving renorm (decay is our graft, dropped)
  muon_update_steps: 5
  ckpt_write: true             # gradient-checkpoint the write update (VRAM)
  gate_extra: []               # off for E1 v1

guidance_scale: 3.0
global_sink: true
slice_last_frames: 9
rope_enhance: true
streaming_training: true
sink_update_ratio: 0.0
use_prompt_cache: true
use_decouple_dmd: false
use_gan: false

vis_interval: -1
vis_ema: false
vis_video_lengths:
- 60
val_batch_size: 1
val_data_path: ckpt/prompts/train/vidprom_filtered_extended.txt
val_switch_prompt_path: ckpt/prompts/train/vidprom_filtered_extended_switch.txt

switch_mode: random_choice
switch_choices:
- 21
- 39

streaming_chunk_size: 21
streaming_max_length: 60
streaming_min_new_frame: 18
train_first_chunk: true
last_step_only: false

adapter:
  type: "lora"
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: "bfloat16"
  apply_to_critic: true
  verbose: false
