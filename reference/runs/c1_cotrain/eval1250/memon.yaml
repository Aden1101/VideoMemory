# c1_cotrain step-1250 :: ARM 1 memon (memory ON, trained MAG weights injected).
# model_kwargs copied EXACTLY from reference/runs/c1_cotrain/c1_cotrain.yaml (gate_init 0.1, ema_alpha 0.0).
# Run with inference/inference.py (CausalInferencePipeline = the memory-RESPECTING causal path;
# the switch/interactive pipelines bypass memory and would VOID the eval).
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
num_frame_per_block: 3
model_name: wan_models/Wan2.1-T2V-1.3B
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3
  memory_layers:
  - 5
  - 16
  - 27
  gate_init: 0.1
  bounded_gate: true
  single_norm: false
  use_decay: false
  muon_update_steps: 5
  ckpt_write: true
  gate_extra: []
  bounded_mod: true
  rel_norm: true
  dc_remove: true
  mem_stream_scale: 1.0
  ema_alpha: 0.0
data_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/reference/runs/e3_antifreeze/heldout/prompts.txt
output_folder: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/reference/runs/c1_cotrain/eval1250/videos/memon
inference_iter: -1
num_output_frames: 240
use_ema: false
seed: 42
num_samples: 1
save_with_index: true
global_sink: true
context_noise: 0
rope_enhance: true
use_prompt_cache: true
generator_ckpt: ckpt/base.pt
lora_ckpt: /shared/ssd_14T_project/adenelmi/c1_cotrain/checkpoint_model_001250/model.pt
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  verbose: false
