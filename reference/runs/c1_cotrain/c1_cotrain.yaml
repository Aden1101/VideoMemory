# c1_cotrain: CLEAN VideoSSM-style co-training. The first honest "make the memory work" run.
# Rationale (2026-07-12 six-agent synthesis + mechanism correction):
#   - e4 already co-trained the LoRA (lora_unfreeze_from_block:0, lr 1e-5) -> "unfreeze" was NOT the
#     missing lever. What made e4 game/freeze = (a) 8-prompt overfit substrate, (b) the whole guardrail
#     objective stack (dnh/act/mm_rel/mm_ext/flick/id) fighting DMD and sweeping degeneracy freeze<->flicker.
#   - VideoSSM (2512.04519) shows a co-trained GLOBAL memory DOES earn a windowed-DMD gradient (reduces
#     drift) with PURE DMD self-rollout, no reconstruction. So the untried-clean run = DROP all guardrails
#     (pure DMD) + HEALTHY 248k substrate + memory active + the injection-taming already in place
#     (rel_norm + dc_remove + bounded_gate) so the injection is neutral-by-construction on plain drift.
# Honest prognosis: do-no-harm (memory ~neutral) on plain drift is the likely outcome (dc_remove -> mem
#   ~= mem-OFF; sink already holds the frame-0 anchor so the memory has little marginal job). A visible
#   POSITIVE shows up mainly on a REVISIT eval, not monotone drift. do-no-harm + clean co-train = an
#   honest paper component (supervisor adds the rest).
# WATCH: freeze (DD collapse) is the failure to catch; grad probe nonzero at steps 0/5/10; 3-way eval
#   mem-ON | mem-OFF | AF-stock every checkpoint (VBench SC+BC+DD priority + a revisit probe).
trainer: score_distillation
max_iters: 2000
log_iters: 250
mixed_precision: true
seed: 0
distribution_loss: dmd_switch
load_raw_video: false
gradient_accumulation_steps: 1
max_checkpoints: 3
auto_resume: false
logdir: /shared/ssd_14T_project/adenelmi/c1_cotrain
use_wandb: true
wandb_project: anchor-forcing-memory
wandb_name: c1_cotrain
ema_weight: 0.99
ema_start_step: 200
generator_ckpt: ckpt/base.pt
lora_ckpt: ckpt/final.pt
resume_step: false
# HEALTHY 248k substrate (NOT the 8-prompt e0_dynamic8 that e4 overfit)
data_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/ckpt/prompts/train/vidprom_filtered_extended_switch.txt
switch_prompt_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/ckpt/prompts/train/vidprom_filtered_extended_switch.txt
batch_size: 1
total_batch_size: 64
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: full
text_encoder_cpu_offload: true
real_score_cpu_offload: true
log_memory_stats: true
assert_memory_drift: true
lr: 1.0e-05
beta1: 0.0
beta2: 0.999
lr_critic: 2.0e-06
beta1_critic: 0.0
beta2_critic: 0.999
lr_mem: 0.0001
lora_unfreeze_from_block: 0
train_write: true
text_dropout_prob: 0.3
# ---- objective: PURE DMD. every guardrail OFF (=> _e3_on False => no twin, no DINO decode) ----
id_loss_weight: 0.0
id_decode_frames: 2
tv_loss_weight: 0.0
tv_motion_floor: 0.0
