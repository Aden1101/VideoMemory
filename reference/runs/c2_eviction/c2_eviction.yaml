# c2_eviction: c1_cotrain + the two fixes that give the memory a JOB (2026-07-14):
#   1. eviction_feed (model_kwargs): the memory WRITES the chunk that just fell out of the
#      attention window (simple FIFO-delay, VideoSSM/AHN-style cache-complement) instead of
#      the CURRENT chunk whose k/v the KV cache already holds (c1's write was redundant by
#      construction). READ query unchanged (current chunk).
#   2. cache_dropout_prob: with prob 0.3 a WHOLE rollout runs with the runtime sink starved
#      to 0 frames (memory ON), so DMD directly rewards the memory for carrying the anchor
#      the sink no longer provides (breaks the "sink already does the job" redundancy).
# Everything else = c1_cotrain verbatim: pure DMD, all guardrails 0, 248k substrate, LoRA
#   fully unfrozen + memory co-trained, injection-taming (rel_norm+dc_remove+bounded_gate),
#   text_dropout 0.3.
# Selftest (reference/runs/c2_eviction/selftest.py): defaults byte-identical (bitwise) to
#   pre-c2; eviction lag verified = window_chunks=4 chunks; sink chunks never written.
# WATCH: freeze (DD collapse) still the failure to catch; grad probe nonzero at steps 0/5/10;
#   3-way eval mem-ON | mem-OFF | AF-stock every checkpoint (VBench SC+BC+DD + revisit probe).
trainer: score_distillation
max_iters: 2000
log_iters: 250
mixed_precision: true
seed: 0
distribution_loss: dmd_switch
load_raw_video: false
gradient_accumulation_steps: 1
max_checkpoints: 3
auto_resume: false
