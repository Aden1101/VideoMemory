  细节模糊不清，字幕，风格，作\
  品，画作，画面，静止，整体发\
  灰，最差质量，低质量，JPEG压缩\
  残留，丑陋的，残缺的，多余的\
  手指，画得不好的手部，画得不\
  好的脸部，畸形的，毁容的，形\
  态畸形的肢体，手指融合，静止\
  不动的画面，杂乱的背景，三条\
  腿，背景人很多，倒着走"
gradient_checkpointing: true
num_frame_per_block: 3
same_step_across_blocks: true
num_train_timestep: 1000
timestep_shift: 5.0
real_name: wan_models/Wan2.1-T2V-1.3B
