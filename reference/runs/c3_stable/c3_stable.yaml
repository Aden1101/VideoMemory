# c3_stable: c2_eviction + the STABILITY PACK that stops the late-training flicker (2026-07-15).
#
# ROOT CAUSE (telemetry autopsy of c2, tfevents steps 0-1355): the injection DESTABILIZES because
#   the TRAINED SLOW memory params (qkv -> read RMS x8; proj/gate -> gatemean up; gatew 0.30->1.76
#   monotone) ramp WITHOUT damping/annealing; at ~step 1000 the injection amplitude crosses a
#   coherence threshold and temporal dispersion (ampdisp_temporal) spikes = flicker. The fast-weight
#   STATE norm is fine (statenorm_ratio pinned 0.999 = renorm working); the critic/DMD loop is flat.
#   $0 probe confirmed: MEM_STREAM_SCALE=0.5 on ckpt1000 halves harm (id_gap -0.253->-0.121, SC up).
#
# THE PACK (all default-off elsewhere; each targets the ramp, NOT the already-controlled fast weight):
#   1. mem_stream_scale 0.5   : HARD-CAP the injection to 0.5x the local residual RMS (bounds amplitude
#                               directly, regardless of slow-param drift). The single most on-mechanism knob.
#   2. lr_mem 5e-5 (was 1e-4) : halve the mem-param drive outright (the ramp is mem-driven).
#   3. weight_decay 0.05      : pull qkv/proj drift back harder (mild; toward 0 not init, so an assist).
#   4. ema_weight 0.99        : LoRA-EMA (now trainable-only, enabled in LoRA mode) damps the weight
#      ema_start_step 250       trajectory (decays per generator update); EVAL sets use_ema:true.
#   5. lr cosine decay        : lr_decay_start 400 -> floors (LoRA 0.1x, mem 0.05x) at max_iters; stops
#                               the late ramp. lr 1e-5->1e-6, lr_mem 5e-5->2.5e-6.
#   6. max_grad_norm_mem 1.0  : explicit clip on the FSDP-IGNORED mem grads (FSDP clip_grad_norm_ SKIPS
#                               them, so they were unclipped in c1/c2).
#   7. cache_dropout anneal   : 0.3 -> 0.1 over 800 steps (removes most of the sink-0 flicker-reward once
#                               the injection is strong, keeps 0.1 so the memory retains a job).
#   8. use_decay true         : HEDGE (fast-weight forget). Telemetry says the state norm is already
#                               controlled, so this is secondary; kept for the indirect read-magnitude cap.
#
# eviction_feed STAYS on (c2's fix that gave the memory its job). Fresh restart from base.pt+final.pt
#   (memory re-inits; use_decay's new decay_logit inits fresh -> no strict-load caveat).
# Selftest (reference/runs/c3_stable/selftest.py): with the pack OFF -> byte-identical to pre-c3; each
#   mechanism verified to FIRE when on.
trainer: score_distillation
max_iters: 2000
log_iters: 250
mixed_precision: true
seed: 0
distribution_loss: dmd_switch
load_raw_video: false
gradient_accumulation_steps: 1
max_checkpoints: 3
auto_resume: false
logdir: /shared/ssd_14T_project/adenelmi/c3_stable
use_wandb: true
wandb_project: anchor-forcing-memory
wandb_name: c3_stable
# ---- c3: LoRA-EMA (trainable-only) damping. ema now RUNS in LoRA mode (was hard-disabled). ----
# 0.99 decays per GENERATOR update (every dfake_gen_update_ratio=5 trainer steps, ~350 updates/run):
# tau ~500 trainer steps, matches c1/c2. (0.999 would barely leave the step-250 snapshot: 0.999^350=0.70.)
ema_weight: 0.99
ema_start_step: 250
generator_ckpt: ckpt/base.pt
lora_ckpt: ckpt/final.pt
resume_step: false
# HEALTHY 248k substrate (NOT the 8-prompt e0_dynamic8 that e4 overfit)
data_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/ckpt/prompts/train/vidprom_filtered_extended_switch.txt
switch_prompt_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/ckpt/prompts/train/vidprom_filtered_extended_switch.txt
batch_size: 1
total_batch_size: 64
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: full
text_encoder_cpu_offload: true
real_score_cpu_offload: true
log_memory_stats: true
assert_memory_drift: true
lr: 1.0e-05
beta1: 0.0
beta2: 0.999
lr_critic: 2.0e-06
beta1_critic: 0.0
beta2_critic: 0.999
# ---- c3: mem-param drive halved + explicit clip on the (FSDP-ignored) mem grads ----
lr_mem: 5.0e-05
max_grad_norm_mem: 1.0
lora_unfreeze_from_block: 0
train_write: true
text_dropout_prob: 0.3
# ---- c3: weight decay raised 0.01 -> 0.05 (pull the slow-mem-param drift back) ----
weight_decay: 0.05
# ---- c3: cosine lr decay (both groups) after warmup; floors kill the late ramp ----
lr_decay_start: 400
lr_floor_frac: 0.1
lr_mem_floor_frac: 0.05
# ---- c2: cache-dropout co-training, now ANNEALED 0.3 -> 0.1 over 800 steps ----
cache_dropout_prob: 0.3
cache_dropout_prob_end: 0.1
cache_dropout_anneal_steps: 800
cache_dropout_sink: 0
# ---- objective: PURE DMD. every guardrail OFF (=> _e3_on False => no twin, no DINO decode) ----
id_loss_weight: 0.0
id_decode_frames: 2
tv_loss_weight: 0.0
tv_motion_floor: 0.0
adv_loss_weight: 0.0
adv_clamp_pos: 0.05
adv_clamp_neg: 0.20
adv_gate_sigma: 0.405
adv_floor_frac: 0.5
dnh_weight: 0.0
dnh_deadband: 0.01
act_weight: 0.0
act_floor: 0.05
mm_rel_weight: 0.0
mm_ext_weight: 0.0
motion_lag2: false
dose_tmean_remove: false
flick_weight: 0.0
flick_deadband: 0.25
# ---- horizon ----
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 240
- 16
- 60
- 104
