# c1_cotrain step-1250 :: ARM 3 AF-stock (memory_layers [] => stock Anchor-Forcing, final.pt LoRA).
# FALLBACK ONLY. The harness REUSES the already-generated held-out stock-AF column at
#   reference/runs/e3_antifreeze/heldout/videos/stockaf   (seed 42, 240 frames, same 6 held-out prompts).
# run_eval.sh will NOT regenerate if those videos exist. This yaml exists so the column can be
# reproduced identically if ever needed (same prompts / seed / frames / memory_layers []).
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
num_frame_per_block: 3
model_name: wan_models/Wan2.1-T2V-1.3B
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3
  memory_layers: []
data_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/reference/runs/e3_antifreeze/heldout/prompts.txt
output_folder: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/reference/runs/e3_antifreeze/heldout/videos/stockaf
inference_iter: -1
num_output_frames: 240
use_ema: false
seed: 42
num_samples: 1
save_with_index: true
global_sink: true
context_noise: 0
rope_enhance: true
use_prompt_cache: true
generator_ckpt: ckpt/base.pt
lora_ckpt: ckpt/final.pt
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  verbose: false
