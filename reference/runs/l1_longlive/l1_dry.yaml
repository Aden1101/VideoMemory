# l1_dry: 6-step GPU smoke test for the l1_longlive re-base. Generated from l1_longlive.yaml
# changing ONLY: logdir -> l1_dry, wandb_name -> l1_dry, use_wandb false, max_iters 6, log_iters 6
# (one save at step 6 exercises the LoRA gather/save path). See SELFTEST_PLAN.md check (ii).
# l1_longlive: c3_stable re-based on the LongLive released LoRA instead of the Anchor-Forcing LoRA
# (2026-07-17). EXACT copy of reference/runs/c3_stable/c3_stable.yaml except the fields listed below.
#
# RE-BASE FACTS (verified by byte/keyset comparison, see reference/runs/l1_longlive/SELFTEST_PLAN.md):
#   - ckpt/base.pt is BYTE-IDENTICAL to LongLive's released longlive_base.pt (HF
#     Efficient-Large-Model/LongLive-1.3B, models/longlive_base.pt). Same substrate -> generator_ckpt
#     UNCHANGED.
#   - LongLive's models/lora.pt has the EXACT loader format our trainer requires: top keys
#     ['generator_lora','critic_lora','step'], 600 peft keys each
#     ('base_model.model.blocks.N....lora_{A,B}.weight'), rank 256, keyset+shapes IDENTICAL to our
#     ckpt/final.pt. Drop-in: only lora_ckpt changes. Weights genuinely differ (mean|delta|~1.7e-2).
#   - lora.pt carries step: 3000; resume_step: false (already set) keeps the run starting at step 0.
#     (If resume_step were true the run would exit instantly: 3000 > max_iters 2000.)
#   - LongLive step-2 trained with local_attn_size 12 / sink_size 3 / num_frame_per_block 3 /
#     timestep_shift 5.0 / rank-alpha 256 = same as this config -> LoRA is in-distribution.
#
# CHANGED vs c3_stable.yaml (NOTHING else):
#   logdir     : /shared/ssd_14T_project/adenelmi/c3_stable -> .../l1_longlive
#                (wandb run name/id = basename(logdir), trainer/distillation.py ~L69)
#   wandb_name : c3_stable -> l1_longlive
#   lora_ckpt  : ckpt/final.pt -> /shared/ssd_14T_project/adenelmi/longlive_ckpt/models/lora.pt
#
# ---- everything below = c3_stable.yaml (stability pack + eviction_feed memory) ----
# c3 pack recap: mem_stream_scale 0.5, lr_mem 5e-5 + max_grad_norm_mem 1.0, weight_decay 0.05,
# LoRA-EMA 0.99 from step 250, cosine lr decay from 400 (floors 0.1x/0.05x), cache_dropout
# 0.3 -> 0.1 over 800 steps, use_decay true, eviction_feed true. Fresh memory init (lora.pt has no
# memory keys; they stay at init, loader prints "memory keys kept at init").
trainer: score_distillation
max_iters: 6
log_iters: 6
mixed_precision: true
seed: 0
distribution_loss: dmd_switch
load_raw_video: false
gradient_accumulation_steps: 1
max_checkpoints: 3
auto_resume: false
logdir: /shared/ssd_14T_project/adenelmi/l1_dry
use_wandb: false
wandb_project: anchor-forcing-memory
wandb_name: l1_dry
# ---- c3: LoRA-EMA (trainable-only) damping. ema now RUNS in LoRA mode (was hard-disabled). ----
# 0.99 decays per GENERATOR update (every dfake_gen_update_ratio=5 trainer steps, ~350 updates/run):
# tau ~500 trainer steps, matches c1/c2. (0.999 would barely leave the step-250 snapshot: 0.999^350=0.70.)
ema_weight: 0.99
ema_start_step: 250
generator_ckpt: ckpt/base.pt
lora_ckpt: /shared/ssd_14T_project/adenelmi/longlive_ckpt/models/lora.pt
resume_step: false
# HEALTHY 248k substrate (NOT the 8-prompt e0_dynamic8 that e4 overfit)
data_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/ckpt/prompts/train/vidprom_filtered_extended_switch.txt
switch_prompt_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/ckpt/prompts/train/vidprom_filtered_extended_switch.txt
batch_size: 1
total_batch_size: 64
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: full
text_encoder_cpu_offload: true
real_score_cpu_offload: true
log_memory_stats: true
assert_memory_drift: true
lr: 1.0e-05
beta1: 0.0
beta2: 0.999
lr_critic: 2.0e-06
beta1_critic: 0.0
beta2_critic: 0.999
# ---- c3: mem-param drive halved + explicit clip on the (FSDP-ignored) mem grads ----
lr_mem: 5.0e-05
max_grad_norm_mem: 1.0
lora_unfreeze_from_block: 0
train_write: true
text_dropout_prob: 0.3
# ---- c3: weight decay raised 0.01 -> 0.05 (pull the slow-mem-param drift back) ----
weight_decay: 0.05
# ---- c3: cosine lr decay (both groups) after warmup; floors kill the late ramp ----
lr_decay_start: 400
lr_floor_frac: 0.1
lr_mem_floor_frac: 0.05
# ---- c2: cache-dropout co-training, now ANNEALED 0.3 -> 0.1 over 800 steps ----
cache_dropout_prob: 0.3
cache_dropout_prob_end: 0.1
cache_dropout_anneal_steps: 800
cache_dropout_sink: 0
# ---- objective: PURE DMD. every guardrail OFF (=> _e3_on False => no twin, no DINO decode) ----
id_loss_weight: 0.0
id_decode_frames: 2
tv_loss_weight: 0.0
tv_motion_floor: 0.0
adv_loss_weight: 0.0
adv_clamp_pos: 0.05
adv_clamp_neg: 0.20
adv_gate_sigma: 0.405
adv_floor_frac: 0.5
dnh_weight: 0.0
dnh_deadband: 0.01
act_weight: 0.0
act_floor: 0.05
mm_rel_weight: 0.0
mm_ext_weight: 0.0
motion_lag2: false
dose_tmean_remove: false
flick_weight: 0.0
flick_deadband: 0.25
# ---- horizon ----
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 240
- 16
- 60
- 104
negative_prompt: "色调艳丽，过曝，静态，\
  细节模糊不清，字幕，风格，作\
  品，画作，画面，静止，整体发\
  灰，最差质量，低质量，JPEG压缩\
  残留，丑陋的，残缺的，多余的\
  手指，画得不好的手部，画得不\
  好的脸部，畸形的，毁容的，形\
  态畸形的肢体，手指融合，静止\
  不动的画面，杂乱的背景，三条\
  腿，背景人很多，倒着走"
gradient_checkpointing: true
num_frame_per_block: 3
same_step_across_blocks: true
num_train_timestep: 1000
timestep_shift: 5.0
real_name: wan_models/Wan2.1-T2V-1.3B
fake_name: wan_models/Wan2.1-T2V-1.3B
generator_name: wan_models/Wan2.1-T2V-1.3B
ts_schedule: false
denoising_loss_type: flow
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3
  memory_layers:
  - 5
  - 16
  - 27
  gate_init: 0.1
  bounded_gate: true
  single_norm: false
  # c3: gated-delta forget on the fast weight (HEDGE; state norm already renorm-pinned)
  use_decay: true
  muon_update_steps: 5
  ckpt_write: true
  gate_extra: []
  bounded_mod: true
  rel_norm: true
  dc_remove: true
  # c3: hard-cap the injection to 0.5x local residual RMS (the primary amplitude brake)
  mem_stream_scale: 0.5
  ema_alpha: 0.0
  # c2: memory writes the EVICTED chunk (FIFO-delayed by the attention window), not the current one
  eviction_feed: true
guidance_scale: 3.0
global_sink: true
slice_last_frames: 27
rope_enhance: true
streaming_training: true
sink_update_ratio: 0.0
use_prompt_cache: true
use_decouple_dmd: false
use_gan: false
vis_interval: 50
vis_ema: false
vis_video_lengths:
- 60
val_batch_size: 1
val_data_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/ckpt/prompts/train/vidprom_filtered_extended.txt
val_switch_prompt_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/ckpt/prompts/train/vidprom_filtered_extended_switch.txt
switch_mode: random_choice
switch_choices:
- 1000
streaming_chunk_size: 21
streaming_max_length: 300
streaming_min_new_frame: 18
train_first_chunk: true
last_step_only: false
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  apply_to_critic: true
  verbose: false
bptt_window: 14
bptt_window_min: 4
grad_tail_W: 1
train_seed_every: 4
