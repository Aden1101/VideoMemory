# LongLive-STOCK **OFFICIEL** : fidèle à NVlabs/LongLive v1.0 (audit
# reference/stock_longlive_fidelity_audit.md). Différence vs stock_probe.yaml :
# rope_enhance FALSE (le Tri-Region RoPE est un ajout d'Anchor-Forcing, absent du code officiel
# LongLive : rope absolu, le sink est lu à distance croissante) et use_prompt_cache false
# (inerte chez nous mais absent chez eux). Les DEUX colonnes sont conservées dans les évals :
# stock (LongLive+tri-region, borne haute) et stockoff (LongLive publié) ; l'écart = la part de
# la résurrection due au schéma positionnel d'AF.
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
num_frame_per_block: 3
model_name: wan_models/Wan2.1-T2V-1.3B
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3
  memory_layers: []
use_ema: false
seed: 42
global_sink: true
context_noise: 0
rope_enhance: false
use_prompt_cache: false
generator_ckpt: ckpt/base.pt
lora_ckpt: /shared/ssd_14T_project/adenelmi/longlive_ckpt/models/lora.pt
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  verbose: false
