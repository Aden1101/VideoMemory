# e4_antiflicker: e3_antifreeze + the anti-flicker CONSTRAINT STACK (Fable e4 recommendation).
# e3_antifreeze traded freeze -> flicker+blur (mem-ON +22.7% patch-luminance temporal std, -28%
# Laplacian sharpness vs the mem-OFF twin; DD 0.996 hollow = shimmer counted as optical-flow motion).
# e4 closes the temporal-artifact family with a CONSTRAINT (not another guardrail):
#   1. ema_alpha 0.25         -- causal temporal EMA low-pass on the injection (makes injected
#                                temporal HF INEXPRESSIBLE at every spatial scale, streaming-causal so
#                                it holds at 240f OOD; per-denoising-step buffer, reset per video,
#                                snapshot-safe in the twin).
#   2. motion_lag2 true       -- flicker-BLIND lag-2 motion statistic in mm_rel/mm_ext + the dose
#                                (removes the flicker PAYER: shimmer no longer counterfeits motion).
#                                motion_targets.json regenerated with the SAME lag-2 stat.
#   3. dose_tmean_remove true -- per-site TEMPORAL-mean removal in the AC-dose (a static overlay /
#                                wallpaper earns ZERO dose -> only slow, state-evolving, spatially
#                                structured change satisfies the floor).
#   4. flick_weight 0.5       -- latent second-temporal-difference hinge vs the twin, as a TRIPWIRE:
#                                under the EMA it should be ~0; a rise flags slow->fast conversion.
# New telemetry (video_memory _project_output): ampdisp_spatial (WANTED relevance coupling) vs
# ampdisp_temporal (the flicker). e4 health = temporal small while spatial stays > 0.
# PRE-REGISTERED: expect DD to DROP when the counterfeit motion is removed -- a DD drop with CLEAN
# visuals is a FIX, not a regression. Most-likely clean equilibrium is inert-with-a-twitch; the seed
# noise-floor measurement (not this dashboard) decides whether the survivor is above seed noise.
# PRE-LAUNCH GATES: syntax; twin selftest E3_TWIN_SELFTEST=1 -> max|real-twin|=0.0 (validates the EMA
# buffer is snapshot-safe); grad probe qkv/proj/lrs nonzero; e3_flick + ampdisp_spatial/temporal fire.
