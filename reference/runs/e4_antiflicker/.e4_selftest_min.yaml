beta2_critic: 0.999
lr_mem: 0.0001
lora_unfreeze_from_block: 0
train_write: true
text_dropout_prob: 0.3
# ---- objective (e3 base) ----
id_loss_weight: 0.0            # REMOVED (freeze-ally)
id_decode_frames: 2            # kept: used by the adv term + the chunk-0 anchor
tv_loss_weight: 0.0            # REMOVED (subsumed by mm terms)
tv_motion_floor: 0.0
adv_loss_weight: 0.0           # BONUS mode (clamped beat-the-twin reward) OFF: freeze-risk, not needed
adv_clamp_pos: 0.05            # (bonus mode only)
adv_clamp_neg: 0.20            # (bonus mode only)
adv_gate_sigma: 0.405          # (bonus-mode gate; also logged as e3_gate diagnostics)
adv_floor_frac: 0.5            # absolute anti-co-freeze floor fires below 0.5x stock-AF motion
dnh_weight: 10.0               # do-no-harm hinge: relu(cos_CF - cos_ON - deadband); unbounded repair
dnh_deadband: 0.01             # tolerated paired-cos noise (cos units)
act_weight: 1.0                # activity floor: relu(act_floor - AC_dose); the ONLY pro-active force
act_floor: 0.05                # provisional; CALIBRATE IN-RUN from e3_dose at step 0-20
mm_rel_weight: 1.0             # two-sided log-motion match to the twin (blocks inject-alters-motion)
mm_ext_weight: 1.0             # one-sided log floor vs the external stock curve (blocks co-freeze)
# ---- e4 anti-flicker constraint stack ----
motion_lag2: true              # flicker-blind lag-2 motion statistic (mm_rel/mm_ext); targets regenerated
dose_tmean_remove: true        # per-site temporal-mean removal in the AC-dose (kills wallpaper payer)
flick_weight: 0.5              # latent D2 anti-flicker hinge (tripwire under the EMA)
flick_deadband: 0.25           # relu deadband relative to the twin's own per-site roughness
motion_target_path: /shared/ssd_14T/home/adenelmi/Anchor-Forcing/reference/runs/e4_antiflicker/motion_targets.json
